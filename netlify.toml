# Netlify baut die Seite bei jeder Änderung (auch aus dem Admin-Bereich /admin) neu.
[build]
  command = "node build.mjs premium"
  publish = "dist-premium"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
