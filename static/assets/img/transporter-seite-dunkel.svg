    <rect x="0" y="70" width="1000" height="16" fill="#ffffff"/>
    <!-- Schattenfläche unten an der Flanke -->
    <path d="M60 252 L940 246 L940 300 L60 304 Z" fill="#e9edf1"/>
    <!-- dunkle Schutzleiste unten -->
    <rect x="0" y="300" width="1000" height="60" fill="#3a4047"/>
    <rect x="0" y="300" width="1000" height="4" fill="#4b525a"/>
  </g>

  <!-- Frontscheibe (schmaler sichtbarer Streifen) -->
  <path d="M180 196 L252 104 Q262 92 276 90 L284 90 L210 188 Q200 196 180 196 Z" fill="#2b3440"/>
  <!-- Seitenfenster Fahrerhaus -->
  <path d="M214 190 L282 102 Q290 94 302 94 L402 94 Q410 94 410 102 L410 184 Q410 190 404 190 Z" fill="#2b3440"/>
  <path d="M232 186 L290 110 L330 110 L268 186 Z" fill="#3c4756"/>
