  <path d="M930 98 L934 300" stroke="#c9d0d8" stroke-width="2" fill="none"/>
  <rect x="926" y="118" width="12" height="96" rx="4" fill="#d6413a"/>
  <!-- Scheinwerfer und Blinker -->
  <path d="M66 248 Q70 234 92 229 L150 213 Q160 211 158 220 L150 236 Q146 242 136 243 L74 252 Z" fill="#2b3440"/>
  <path d="M92 236 L140 224 L136 234 L90 242 Z" fill="#dfe6ee"/>
  <!-- Kühlergrill vorne (Kante) -->
  <path d="M60 262 L72 262 L72 296 L60 296 Z" fill="#3a4047"/>

  <!-- Radkästen -->
  <g clip-path="url(#ueberboden)" fill="#2a3036">
    <circle cx="216" cy="338" r="74"/>
    <circle cx="760" cy="338" r="74"/>
