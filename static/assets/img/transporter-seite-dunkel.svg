  <path d="M206 300 L206 196" stroke="#c9d0d8" stroke-width="2.5" fill="none"/>
  <!-- Schiebetür -->
  <path d="M446 92 L446 300 M700 92 L700 300" stroke="#c9d0d8" stroke-width="2.5" fill="none"/>
  <!-- Schiebetür-Schiene -->
  <path d="M700 214 L928 212" stroke="#c9d0d8" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Griffe -->
  <rect x="380" y="206" width="30" height="8" rx="4" fill="#3a4047"/>
  <rect x="460" y="206" width="30" height="8" rx="4" fill="#3a4047"/>
