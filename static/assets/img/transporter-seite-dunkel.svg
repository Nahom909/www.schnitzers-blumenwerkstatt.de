    </clipPath>
  </defs>

  <!-- Schatten am Boden -->
  <ellipse cx="500" cy="396" rx="440" ry="12" fill="#000" fill-opacity=".55"/>

  <!-- Karosserie -->
  <path d="M72 330 Q60 326 60 306 L62 252 Q64 230 92 223 L172 199 Q186 195 196 182 L258 100 Q272 80 300 78 L898 76 Q930 76 933 104 L940 318 Q940 338 918 338 L838 338 A78 78 0 0 0 682 338 L294 338 A78 78 0 0 0 138 338 L96 338 Q78 338 72 330 Z" fill="#f7f8fa"/>
  <g clip-path="url(#body)">
